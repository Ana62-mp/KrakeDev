
<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <link rel="stylesheet" href="orden.css"/>
    <script src="utilitarios.js"></script>
    <script src="orden.js"></script>
</head>

<body onload="mostrarTabla();">
    <div class="principal">
        <div class="logoEscuela">
            <img src="logoKrakeDev.png" width="80%" />
        </div>

        <div class="contenido">
            <div class="titulo">
                AGREGAR PERSONA
            </div>

            <div class="ingresoDatos">
                <div class="tituloCampo">
                    NOMBRE
                </div>
                <div>
                    <input type="text" class="cajaTexto" id="txtNombre"/>
                    <div class="error" id="errorNombre"></div>
                </div>
            </div>
           
            <div class="ingresoDatos">
                <div class="tituloCampo">
                    EDAD
                </div>
                <div>
                    <input type="text" class="cajaTexto" id="txtEdad"/>
                    <div class="error" id="errorEdad"></div>
                </div>
            </div>
            <div class="botones">
                <div class="contenedorBoton">
                    <input type="button" value="GUARDAR"
                     class="estiloBoton" onclick="agregarPersona();" />
                </div>
                
                <div class="botonesEncontrar">
                    <div class="contenedorBoton">
                        <input type="button" value="ENCONTRAR MAYOR"
                         class="estiloBoton" onclick="determinarMayor();" />
                    </div>   
                    <div class="contenedorBoton">
                        <input type="button" value="ENCONTRAR MENOR"
                         class="estiloBoton" onclick="determinarMenor();" />
                    </div>                
                </div>
             </div>
        </div>
        <div class="areaResultado">
            <div class="areaTabla" id="tablaPersonas">
            </div>
            <br><div class="resultadoTexto1" id="personaMayor"></div>
            <br><div class="resultadoTexto2" id="personaMenor"></div>
        </div>
    </div>
</body>

</html>
